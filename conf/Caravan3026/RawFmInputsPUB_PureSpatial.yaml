# @package _global_
# CONTROL for the daily-embedding ablation set: no foundation model at all.
# The raw variables the StefaLand would have consumed are fed straight to the
# residual adapter as additional time/static inputs beside the task's own
# forcings/attributes. Nothing is encoded and no embedding file is read, so
# the delta against EmbeddingDailyPUB_PureSpatial isolates what the pretrained
# encoder contributes over its own inputs.
# Everything downstream of the adapter (dual_residual adapter, 256-wide
# residual LSTM, projection) is held identical to that baseline, and d_model
# is kept at 64 so the two are capacity-matched. See
# src/dmg/models/neural_networks/raw_fm_inputs_finetuneing.py -- in particular
# the note that the adapter's hidden/residual stream is zeros here, because no
# hidden representation exists to refine.
defaults:
  - _self_
  - /hydra: settings
  - /observations: caravan3026_official

name: ${observations.name}/${model.nn.name}/${test.name}/pure_spatial

## General -------------------------------#
mode: train_test
multimodel_type: none

seed: 111111
cache_states: False
device: cuda
gpu_id: 0

# NnDualLoader (not EmbeddingFinetuneLoader): this model needs the raw
# pretrained-format variables under 'xc_pretrained_norm', which is exactly
# what NnDualLoader already supplies to DirectFinetuneing. No embedding_path.
data_loader: NnDualLoader
data_sampler: HydroSampler
trainer: FinetuneTrainer
save_path: ${oc.env:DMG_OUTPUT_ROOT}/Caravan3026/
data_path: ${oc.env:DMG_DATA_ROOT}/caravan_zenodo/OfficailCaravan_camels_only_singlefile_direct_dropHighNaNTrue_stationids.nc
# Same foundation-model-schema file StefaLandNoPretrainPUB_PureSpatial reads.
# Allowed here for the same reason it is allowed there: this config is about
# the foundation model's own variable set, not a task-native baseline. The
# file has a correct station_ids coordinate and the exact
# P/RelHum/SWd/Tmax/Tmin + 48-static schema listed below.
pretrained_path: ${oc.env:DMG_DATA_ROOT}/CarvanPretrain/3026Carvan_refpoints.nc


## Training ------------------------------#
# Window, optimizer and epoch budget held at the baseline's values so the
# comparison is an architecture/inputs comparison, not a training one.
train:
  start_time: 1998/01/01
  end_time: 2008/12/31
  target: [streamflow]
  optimizer:
    name: Adadelta
  lr: 1.0
  lr_scheduler:
    name: none
  loss_function:
    name: RmseLoss
  batch_size: 128
  epochs: 50
  start_epoch: 0
  save_epoch: 25


## Evaluation -------------------------------#
test:
  start_time: 1998/01/01
  end_time: 2008/12/31
  batch_size: 128
  test_epoch: 50
  name: spatial
  type: spatial
  extent: PUB
  holdout_indexs: [0,1,2,3,4]

  huc_regions:
      - [1]
      - [2]
      - [3]
      - [4]

  PUB_ids: [1, 2, 3, 4, 5]

## Inference -------------------------------#
sim:
  start_time: 2008/01/01
  end_time: 2008/12/31
  batch_size: 128


## Differentiable Model -----------------------------#
model:
  rho: 365
  warmup: 365
  use_log_norm: []

  phy:
    name: [Hbv_1_1p_Triton]
    nmul: 16
    warmup_states: True
    dy_drop: 0.0
    dynamic_params:
      Hbv_1_1p_Triton: [parBETA, parK0, parBETAET]

    routing: True
    nearzero: 1e-5

    # NnDualLoader always derives HBV's [prcp, tmean, pet] forcings via
    # Hargreaves-Samani from model.phy.raw_forcings. raw_forcings order is
    # fixed: [P, Tmax, Tmin, radiation]; a 5th element is used as measured PET
    # directly instead of being HS-derived.
    forcings: [prcp, tmean, pet]
    raw_forcings: [
      total_precipitation_sum,
      temperature_2m_max,
      temperature_2m_min,
      surface_net_solar_radiation_mean,
      potential_evaporation_sum_FAO_PENMAN_MONTEITH,
    ]
    attributes: []

  nn:
    name: RawFmInputsFinetuneing
    out_size: 1

    # Adapter/decoder width. No embedding is read -- this is named
    # 'embedding_size' only so it can be pinned to the daily-embedding
    # baseline's 64 for a capacity-matched comparison.
    embedding_size: 64
    dropout: 0.1

    # Identical to EmbeddingDailyPUB_PureSpatial's adapter and decoder.
    adapter_type: dual_residual
    adapter_params:
      dropout: 0.1
      combined_dropout: 0.2
      hidden_multiplier: 2

    use_residual_lstm: True
    lstm_hidden_size: 256

    # Task-side variables, read from data_path. Same list as every other
    # Caravan3026 baseline's nn block.
    forcings: [
      total_precipitation_sum,
      temperature_2m_mean,
      temperature_2m_max,
      temperature_2m_min,
      surface_net_solar_radiation_mean,
      surface_pressure_mean,
      potential_evaporation_sum_FAO_PENMAN_MONTEITH,
    ]
    attributes: [
      lat, lon, area,
      ele_mt_sav, slp_dg_sav,
      for_pc_sse,
      cly_pc_sav, snd_pc_sav, slt_pc_sav, swc_pc_syr, soc_th_sav,
      kar_pc_sse,
      p_mean, pet_mean_FAO_PM, aridity_FAO_PM, seasonality_FAO_PM,
      frac_snow, high_prec_freq, high_prec_dur, low_prec_freq, low_prec_dur,
      moisture_index_FAO_PM,
    ]

    # Foundation-model-side variables, read from pretrained_path. In
    # DirectFinetuneing these define the encoder's architecture; here they ARE
    # the additional adapter inputs -- the encoder is gone. Kept byte-identical
    # to StefaLandNoPretrainPUB_PureSpatial's lists (the verified exact-match
    # set for StefaLandGlobal20.pt: 5 ts vars, 48 static vars, no Runoff) so
    # this control sees precisely the variable set the FM line of work uses.
    pretrained_time_series_vars: [P, RelHum, SWd, Tmax, Tmin]
    pretrained_static_vars: [
      ETPOT_Hargr, GMTED_aspectcosine, GMTED_elevation, GMTED_slope,
      HWSD_clay, HWSD_gravel, HWSD_sand, HWSD_silt,
      MODIS_NDVI, MSWEP_P, MSWX_LWd, MSWX_PET, MSWX_RH, MSWX_SWd,
      MSWX_SpecHum, MSWX_Tmax, MSWX_Tmean, MSWX_Tmin, MSWX_Wind,
      Permeability_no_permafrost,
      SoilGrid2_bulk_density, SoilGrid2_clay, SoilGrid2_organic_carbon_stock,
      SoilGrid2_sand, SoilGrid2_silt,
      agriculture_fraction_2000, agriculture_fraction_2018,
      carbonate_sedimentary_rocks_frac, catchsize,
      forest_fraction_2000, forest_fraction_2018,
      gdp_2000_buffer,
      grassland_fraction_2000, grassland_fraction_2018,
      intact_forest, meanP, meanTa,
      population_density_2000_buffer, porosity,
      seasonality_P, seasonality_PET,
      snow_fraction, snowfall_fraction, soil_depth, soil_erosion, soil_moisture,
      urban_fraction_2000, urban_fraction_2018,
    ]
