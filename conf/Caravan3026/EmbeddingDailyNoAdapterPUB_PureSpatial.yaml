# @package _global_
# ABLATION 1 of 3 on EmbeddingDailyPUB_PureSpatial: remove the adapter layer.
# Identical to EmbeddingDailyPUB_PureSpatial in every respect except
# model.nn.adapter_type, which becomes 'none' -> build_adapter() returns
# nn.Identity (src/dmg/models/neural_networks/adapters/build_adapter.py), so
# the LayerNorm'd embedding reaches the LSTM decoder untouched.
# Note what this does and does not isolate: use_residual_lstm stays True, so
# the task forcings and static attributes still enter through pre_lstm/
# post_lstm. That is deliberate -- the only removed component is the adapter
# itself, which is what makes the delta against the baseline attributable to
# the adapter rather than to a loss of task features.
defaults:
  - _self_
  - /hydra: settings
  - /observations: caravan3026_official

name: ${observations.name}/${model.nn.name}/daily_noadapter/${test.name}/pure_spatial

## General -------------------------------#
mode: train_test  # train, test, train_test, sim
multimodel_type: none

seed: 111111
cache_states: False
device: cuda
gpu_id: 0

data_loader: EmbeddingFinetuneLoader
data_sampler: HydroSampler
trainer: FinetuneTrainer
save_path: ${oc.env:DMG_OUTPUT_ROOT}/Caravan3026/
data_path: ${oc.env:DMG_DATA_ROOT}/caravan_zenodo/OfficailCaravan_camels_only_singlefile_direct_dropHighNaNTrue_stationids.nc
# Condensed (reconstruction-trained, 64-dim) daily embedding -- see
# scripts/jobs/caravan3026/01_train_condenser_daily.sh.
embedding_path: ${oc.env:DMG_EMBEDDING_ROOT}/Condensers/Caravan3026_StefaLand256_condenser_daily64_embedding.nc


## Training ------------------------------#
# Window and split identical to the baseline so the ablation is comparable.
train:
  start_time: 1998/01/01
  end_time: 2008/12/31
  target: [streamflow]
  optimizer:
    name: Adadelta
  lr: 1.0
  lr_scheduler:
    name: none
  loss_function:
    name: RmseLoss
  batch_size: 128
  epochs: 50
  start_epoch: 0
  save_epoch: 25


## Evaluation -------------------------------#
test:
  start_time: 1998/01/01
  end_time: 2008/12/31
  batch_size: 128
  test_epoch: 50
  name: spatial
  type: spatial      # dispatches to run_spatial_testing()
  extent: PUB
  holdout_indexs: [0,1,2,3,4] # 5-fold PUB

  huc_regions:
      - [1]
      - [2]
      - [3]
      - [4]

  PUB_ids: [1, 2, 3, 4, 5]

## Inference -------------------------------#
sim:
  start_time: 2008/01/01
  end_time: 2008/12/31
  batch_size: 128


## Differentiable Model -----------------------------#
model:
  rho: 365
  warmup: 365
  use_log_norm: []

  phy:
    name: [Hbv_1_1p_Triton]
    nmul: 16
    warmup_states: True
    dy_drop: 0.0
    dynamic_params:
      Hbv_1_1p_Triton: [parBETA, parK0, parBETAET]

    routing: True
    nearzero: 1e-5

    # EmbeddingFinetuneLoader always derives HBV's [prcp, tmean, pet]
    # forcings via Hargreaves-Samani from model.phy.raw_forcings (never by
    # looking up 'forcings:' names directly in data_path -- that field is
    # just a semantic label matching this repo's convention). raw_forcings
    # order is fixed: [P, Tmax, Tmin, radiation].
    forcings: [prcp, tmean, pet]
    # 5th element (potential_evaporation_sum_FAO_PENMAN_MONTEITH) is used
    # as measured PET directly, not Hargreaves-Samani-derived (see
    # embedding_finetune_loader.py: raw_forcings.shape[-1] >= 5 skips the HS
    # approximation). tmean is still derived from Tmax/Tmin.
    raw_forcings: [
      total_precipitation_sum,
      temperature_2m_max,
      temperature_2m_min,
      surface_net_solar_radiation_mean,
      potential_evaporation_sum_FAO_PENMAN_MONTEITH,
    ]
    attributes: []

  nn:
    name: EmbeddingFinetuneing
    out_size: 1

    # Must equal the condensed embedding's width (64).
    embedding_size: 64
    embedding_var_name: embedding
    dropout: 0.1

    # THE ABLATION: 'none' -> nn.Identity in place of DualResidualAdapter.
    # adapter_params is intentionally omitted -- build_adapter ignores it for
    # this type, and leaving it in would imply a configured adapter exists.
    adapter_type: none

    use_residual_lstm: True
    lstm_hidden_size: 256

    forcings: [
      total_precipitation_sum,
      temperature_2m_mean,
      temperature_2m_max,
      temperature_2m_min,
      surface_net_solar_radiation_mean,
      surface_pressure_mean,
      potential_evaporation_sum_FAO_PENMAN_MONTEITH,
    ]
    attributes: [
      lat, lon, area,
      ele_mt_sav, slp_dg_sav,
      for_pc_sse,
      cly_pc_sav, snd_pc_sav, slt_pc_sav, swc_pc_syr, soc_th_sav,
      kar_pc_sse,
      p_mean, pet_mean_FAO_PM, aridity_FAO_PM, seasonality_FAO_PM,
      frac_snow, high_prec_freq, high_prec_dur, low_prec_freq, low_prec_dur,
      moisture_index_FAO_PM,
    ]
