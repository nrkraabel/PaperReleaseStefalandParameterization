# @package _global_
defaults:
  - _self_
  - /hydra: settings
  - /observations: caravan3026_official

name: ${observations.name}/${model.nn.name}/${test.name}/pure_spatial_alphaearth

## General -------------------------------#
mode: train_test
multimodel_type: none

seed: 111111
cache_states: False
device: cuda
gpu_id: 0

data_loader: NnDualLoader
data_sampler: HydroSampler
trainer: FinetuneTrainer
save_path: ${oc.env:DMG_OUTPUT_ROOT}/Caravan3026/
# Byte-identical copy of the task file LSTMHBVPUB_PureSpatial.yaml uses, plus
# 64 static AlphaEarth attributes (ae_00..ae_63) joined on station_id -- see
# scripts/merge_alphaearth_caravan3026.py. Forcings and every other static
# var are unchanged, so this run differs from the LSTMHBV baseline only by
# the AlphaEarth block at the bottom of model.nn.attributes.
data_path: ${oc.env:DMG_DATA_ROOT}/caravan_zenodo/OfficailCaravan_camels_only_singlefile_direct_dropHighNaNTrue_stationids_alphaearth.nc
pretrained_path: ${oc.env:DMG_DATA_ROOT}/caravan_zenodo/OfficailCaravan_camels_only_singlefile_direct_dropHighNaNTrue_stationids_alphaearth.nc


## Training ------------------------------#
# Pure spatial: train and test share the same 1998-2008 window, so the only
# thing held out is the PUB basin set (contrast the spatial_temporal variant).
train:
  start_time: 1998/01/01
  end_time: 2008/12/31
  target: [streamflow]
  optimizer:
    name: Adadelta
  lr: 1.0
  lr_scheduler:
    name: none
  loss_function:
    name: RmseLoss
  batch_size: 128
  epochs: 50
  start_epoch: 0
  save_epoch: 25


## Evaluation -------------------------------#
test:
  start_time: 1998/01/01
  end_time: 2008/12/31
  batch_size: 128
  test_epoch: 50
  name: spatial
  type: spatial
  extent: PUB
  holdout_indexs: [0,1,2,3,4]

  huc_regions:
      - [1]
      - [2]
      - [3]
      - [4]

  PUB_ids: [1, 2, 3, 4, 5]

## Inference -------------------------------#
sim:
  start_time: 2008/01/01
  end_time: 2008/12/31
  batch_size: 128


## Differentiable Model -----------------------------#
model:
  rho: 365
  warmup: 365
  use_log_norm: []

  phy:
    name: [Hbv_1_1p_Triton]
    nmul: 16
    warmup_states: True
    dy_drop: 0.0
    dynamic_params:
      Hbv_1_1p_Triton: [parBETA, parK0, parBETAET]

    routing: True
    nearzero: 1e-5

    # NnDualLoader always derives HBV's [prcp, tmean, pet] forcings via
    # Hargreaves-Samani from model.phy.raw_forcings (never by looking up
    # 'forcings:' names directly in data_path -- that field is just a
    # semantic label matching this repo's convention). raw_forcings order
    # is fixed: [P, Tmax, Tmin, radiation].
    forcings: [prcp, tmean, pet]
    # 5th element (potential_evaporation_sum_FAO_PENMAN_MONTEITH) is used
    # as measured PET directly, not Hargreaves-Samani-derived (see
    # nn_dual_loader.py/embedding_finetune_loader.py: raw_forcings.shape[-1]
    # >= 5 skips the HS approximation). tmean is still derived from Tmax/Tmin.
    raw_forcings: [
      total_precipitation_sum,
      temperature_2m_max,
      temperature_2m_min,
      surface_net_solar_radiation_mean,
      potential_evaporation_sum_FAO_PENMAN_MONTEITH,
    ]
    attributes: []

  nn:
    name: CudnnLstmModel
    hidden_size: 256
    dropout: 0.1

    forcings: [
      total_precipitation_sum,
      temperature_2m_mean,
      temperature_2m_max,
      temperature_2m_min,
      surface_net_solar_radiation_mean,
      surface_pressure_mean,
      potential_evaporation_sum_FAO_PENMAN_MONTEITH,
    ]
    attributes: [
      lat, lon, area,
      ele_mt_sav, slp_dg_sav,
      for_pc_sse,
      cly_pc_sav, snd_pc_sav, slt_pc_sav, swc_pc_syr, soc_th_sav,
      kar_pc_sse,
      p_mean, pet_mean_FAO_PM, aridity_FAO_PM, seasonality_FAO_PM,
      frac_snow, high_prec_freq, high_prec_dur, low_prec_freq, low_prec_dur,
      moisture_index_FAO_PM,
      # AlphaEarth satellite-embedding attributes (64-dim, static per basin).
      # This block is the ONLY difference from LSTMHBVPUB_PureSpatial.yaml.
      ae_00, ae_01, ae_02, ae_03, ae_04, ae_05, ae_06, ae_07,
      ae_08, ae_09, ae_10, ae_11, ae_12, ae_13, ae_14, ae_15,
      ae_16, ae_17, ae_18, ae_19, ae_20, ae_21, ae_22, ae_23,
      ae_24, ae_25, ae_26, ae_27, ae_28, ae_29, ae_30, ae_31,
      ae_32, ae_33, ae_34, ae_35, ae_36, ae_37, ae_38, ae_39,
      ae_40, ae_41, ae_42, ae_43, ae_44, ae_45, ae_46, ae_47,
      ae_48, ae_49, ae_50, ae_51, ae_52, ae_53, ae_54, ae_55,
      ae_56, ae_57, ae_58, ae_59, ae_60, ae_61, ae_62, ae_63,
    ]
