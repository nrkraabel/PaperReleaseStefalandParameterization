defaults:
  - _self_
  - hydra: settings
  - observations: camels_671

name: ${model.nn.name}
exp_name: null


## General -------------------------------#
mode: train_test  # train, test, train_test, sim

seed: 111111
logging: tensorboard
cache_states: False
device: cuda
gpu_id: 3

data_loader: HydroLoader
data_sampler: HydroSampler
trainer: Trainer

# model_dir:


## Training ------------------------------#
train:
  # start_time: 1999/10/01
  # end_time: 2008/09/30
  start_time: 1980/10/01
  end_time: 1995/09/30
  target: [streamflow]
  optimizer:
    name: Adadelta
  lr: 1.0
  lr_scheduler:
    name: none
  loss_function:
    # name: RmseCombLoss # RmseCombLoss (low exp), NseBatchLoss (high exp)
    name: NseBatchLoss

  batch_size: 100
  epochs: 300
  start_epoch: 0
  save_epoch: 50


## Evaluation -------------------------------#
test:
  # start_time: 1989/10/01
  # end_time: 1999/09/30
  start_time: 1995/10/01
  end_time: 2010/09/30
  batch_size: 25
  test_epoch: 300


## Inference -------------------------------#
sim:
  # start_time: 1989/10/01
  # end_time: 1999/09/30
  start_time: 1995/10/01
  end_time: 2010/09/30
  batch_size: 25


## LSTM Model -----------------------------#
model:
  rho: 365
  warmup: 365
  flow_regime: 'high'  # low (log norm on streamflow and prcp), high (gaussian norm)

  nn:
    name: CudnnLstmModel
    dropout: 0.5
    hidden_size: 256
    out_size: 1

    forcings: [
      dayl,
      prcp,
      srad,
      tmean,
      vp,
    ]
    attributes: [
      p_mean,
      pet_mean,
      p_seasonality,
      frac_snow,
      aridity,
      high_prec_freq,
      high_prec_dur,
      low_prec_freq,
      low_prec_dur,
      elev_mean,
      slope_mean,
      area_gages2,
      frac_forest,
      lai_max,
      lai_diff,
      gvf_max,
      gvf_diff,
      dom_land_cover_frac,
      dom_land_cover,
      root_depth_50,
      soil_depth_pelletier,
      soil_depth_statsgo,
      soil_porosity,
      soil_conductivity,
      max_water_content,
      sand_frac,
      silt_frac,
      clay_frac,
      geol_1st_class,
      glim_1st_class_frac,
      geol_2nd_class,
      glim_2nd_class_frac,
      carbonate_rocks_frac,
      geol_porosity,
      geol_permeability,
    ]
