defaults:
  - _self_
  - hydra: settings
  - observations: camels_531  # camels_531, camels_671

name: ${model.nn.name}-${model.phy.name}
exp_name: null


## General -------------------------------#
mode: train_test  # train, test, train_test, sim

seed: 111111
logging: tensorboard  # tensorboard, wandb, None
cache_states: False
device: cuda
gpu_id: 1

data_loader: HydroLoader
data_sampler: HydroSampler
trainer: Trainer

# model_dir:


## Training ------------------------------#
train:
  start_time: 1999/10/01
  end_time: 2008/09/30
  target: [streamflow]
  optimizer:
    name: Adadelta
  lr: 1.0
  lr_scheduler:
    name: none
    step_size: 10
    gamma: 0.5
  loss_function:
    name: NseBatchLoss  # RmseCombLoss, NseBatchLoss, KgeBatchLoss

  batch_size: 100
  epochs: 100
  start_epoch: 0
  save_epoch: 5


## Evaluation -------------------------------#
test:
  start_time: 1989/10/01
  end_time: 1999/09/30
  batch_size: 25
  test_epoch: 100


## Inference -------------------------------#
sim:
  start_time: 1989/10/01
  end_time: 1999/09/30
  batch_size: 25


## Differentiable Model -----------------------------#
model:
  rho: 365
  warmup: 365
  use_log_norm: [prcp]

  phy:
    name: [SacsmaNoaa_Triton]  # Hbv, Hbv_1_1p, Prms, SacsmaSnow
    nmul: 16
    warmup_states: True  # If False, tracking gradient from spin-up.
    dy_drop: 0.0
    dynamic_params:
      SacsmaNoaa_Triton: [pctim, adimp, riva, zperc, rexp, pfree, parTT, parCWH]
      # SacsmaNoaa_Triton: [pctim, rexp, pfree, parCWH]

    routing: True
    nearzero: 1e-5

    p_partition: 1
    p_dt: 1

    forcings: [
      prcp,
      tmean,
      pet,
    ]
    attributes: []

  nn:
    name: CudnnLstmModel # LstmModel
    dropout: 0.5
    hidden_size: 256

    forcings: [
      prcp,
      tmean,
      pet,
    ]
    attributes: [
      p_mean,
      pet_mean,
      p_seasonality,
      frac_snow,
      aridity,
      high_prec_freq,
      high_prec_dur,
      low_prec_freq,
      low_prec_dur,
      elev_mean,
      slope_mean,
      area_gages2,
      frac_forest,
      lai_max,
      lai_diff,
      gvf_max,
      gvf_diff,
      dom_land_cover_frac,
      dom_land_cover,
      root_depth_50,
      soil_depth_pelletier,
      soil_depth_statsgo,
      soil_porosity,
      soil_conductivity,
      max_water_content,
      sand_frac,
      silt_frac,
      clay_frac,
      geol_1st_class,
      glim_1st_class_frac,
      geol_2nd_class,
      glim_2nd_class_frac,
      carbonate_rocks_frac,
      geol_porosity,
      geol_permeability,
    ]
